name: Gitleaks History Scan

# The staged guard (scripts/check-staged.sh) only sees new commits; this scans the
# whole history weekly for credentials that reached it anyway.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan full git history for leaked credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Bump both together; the checksum comes from the release's
      # gitleaks_<version>_checksums.txt (linux_x64 line).
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan full history
        # --redact keeps any finding's secret value out of the public job log.
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'
