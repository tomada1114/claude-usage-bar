# Pinned CLI tool versions — the reproducibility analog of uv's lockfile for dev tools.
# Never use "latest": Renovate (.github/renovate.json) opens the bump PRs, 7 days after a release.
[tools]
xcodegen = "2.46.0"
swiftlint = "0.65.1"
swiftformat = "0.63.0"
xcbeautify = "3.2.1"
just = "1.58.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"
typos = "1.50.2"
